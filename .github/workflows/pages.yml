name: Deploy Morpheus PWA

on:
  push:
    branches: [main]
    paths:
      - "morpheus-george/**"
      - "apex/**"
      - "sales-os/**"
      - "sales-os-v2/**"
      - "sales-os-v3/**"
      - "sales-os-v4/**"
      - "sho-koi-2027-proposal/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

