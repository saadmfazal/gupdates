<!DOCTYPE html>
<html>
<head>
  <title>Entry System</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      color: #fff;
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    h2 { text-align:center; color:#d4af37; }

    .card {
      background:#111;
      padding:20px;
      border-radius:15px;
      border:1px solid #222;
      margin-bottom:20px;
    }

    label { margin-top:12px; display:block; color:#aaa; }

    select,input,textarea {
      width:100%;
      padding:10px;
      border-radius:8px;
      border:1px solid #222;
      background:#000;
      color:#fff;
    }

    button {
      margin-top:15px;
      padding:12px;
      width:100%;
      border:none;
      border-radius:10px;
      background:red;
      color:#fff;
      font-weight:bold;
      cursor:pointer;
    }

    table { width:100%; margin-top:15px; border-collapse:collapse; }
    th,td { padding:8px; border-bottom:1px solid #222; }
    th { color:#d4af37; }

    #comingSoon { display:none; text-align:center; }
  </style>
</head>

<body>

<h2>Entry System</h2>

<div class="card">

<button onclick="refreshData()">🔄 Refresh Questions</button>

<label>Entry Type</label>
<select id="entryType">
  <option selected>Update</option>
  <option>Finance</option>
  <option>Shipment</option>
  <option>Client</option>
</select>

<div id="updateSection">

<label>Project</label>
<select id="project"></select>

<label>Category</label>
<select id="category"></select>

<label>Sub Category</label>
<select id="sub"></select>

<div id="formArea"></div>

<button onclick="submitForm()">Submit</button>

</div>

<div id="comingSoon">
  <h3 style="color:#d4af37;">🚀 Coming Soon</h3>
</div>

</div>

<div class="card">
<h3>Entries</h3>
<table id="dataTable"></table>
</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbwc25k6tYol745kkedgx19ME4Wl9THf8_sGsWr2p5LqEQ8UAXSYKd1rNjWthRYLsNdv5g/exec";

let rawData = [];
let formStructure = [];
let entries = [];

// INIT
window.onload = loadAll;

function loadAll() {
  loadQuestions();
  loadEntries();
}

// 🔹 LOAD QUESTIONS
function loadQuestions() {
  fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"getAllQuestions"})
  })
  .then(r=>r.json())
  .then(data=>{
    rawData = data;
    loadProjects();
  });
}

// 🔹 REFRESH
function refreshData(){
  loadQuestions();
}

// 🔹 PROJECT
function loadProjects(){
  let projects=[...new Set(rawData.map(r=>r.project))];
  fill("project",projects);
}

// 🔹 CATEGORY
document.getElementById("project").onchange=function(){
  let project=this.value;

  let cats=rawData.filter(r=>r.project===project).map(r=>r.category);
  fill("category",[...new Set(cats)]);

  filterTable();
};

// 🔹 SUB
document.getElementById("category").onchange=function(){
  let project=document.getElementById("project").value;
  let category=this.value;

  let subs=rawData.filter(r=>r.project===project && r.category===category).map(r=>r.sub);
  fill("sub",[...new Set(subs)]);

  filterTable();
};

// 🔹 FIXED PART (THIS WAS BROKEN)
document.getElementById("sub").onchange=function(){

  let project = document.getElementById("project").value;
  let category = document.getElementById("category").value;
  let sub = this.value;

  let row = rawData.find(r =>
    r.project === project &&
    r.category === category &&
    r.sub === sub
  );

  if(!row){
    document.getElementById("formArea").innerHTML="";
    return;
  }

  buildForm(row.fields);
  filterTable();
};

// 🔹 FORM
function buildForm(fields){
  let html="";

  fields.forEach((f,i)=>{
    html+=`<label>${f.label}</label>`;

    if(f.type==="textarea") html+=`<textarea id="f${i}"></textarea>`;
    else if(f.type==="date") html+=`<input type="date" id="f${i}">`;
    else if(f.type==="number") html+=`<input type="number" id="f${i}">`;
    else html+=`<input type="text" id="f${i}">`;
  });

  document.getElementById("formArea").innerHTML=html;
  formStructure=fields;
}

// 🔹 SUBMIT
function submitForm(){

  let data={
    action:"saveUpdate",
    project:document.getElementById("project").value,
    category:document.getElementById("category").value,
    subCategory:document.getElementById("sub").value
  };

  formStructure.forEach((f,i)=>{
    data[f.key]=document.getElementById("f"+i).value;
  });

  let fd=new URLSearchParams();
  fd.append("data",JSON.stringify(data));

  fetch(API,{
    method:"POST",
    mode:"no-cors",
    body:fd
  }).then(()=>{
    alert("Saved");
    loadEntries();
  });
}

// 🔹 LOAD ENTRIES
function loadEntries(){
  fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"getEntries"})
  })
  .then(r=>r.json())
  .then(data=>{
    entries=data;
    render(entries);
  });
}

// 🔹 FILTER TABLE
function filterTable(){

  let p = document.getElementById("project").value;
  let c = document.getElementById("category").value;
  let s = document.getElementById("sub").value;

  let filtered = entries.filter(e =>
    (!p || e["Project"] === p) &&
    (!c || e["Category"] === c) &&
    (!s || e["Sub Category"] === s)
  );

  render(filtered);
}

// 🔹 RENDER TABLE
function render(data){

  if(data.length === 0){
    document.getElementById("dataTable").innerHTML = "<tr><td>No entries</td></tr>";
    return;
  }

  let headers = Object.keys(data[0]);

  let html = "<tr>";

  headers.forEach(h => {
    html += `<th>${h}</th>`;
  });

  html += "</tr>";

  data.forEach(row => {
    html += "<tr>";

    headers.forEach(h => {
      let val = row[h] || "";
      html += `<td>${val}</td>`;
    });

    html += "</tr>";
  });

  document.getElementById("dataTable").innerHTML = html;
}

// 🔹 ENTRY TYPE
document.getElementById("entryType").onchange=function(){
  if(this.value==="Update"){
    updateSection.style.display="block";
    comingSoon.style.display="none";
  }else{
    updateSection.style.display="none";
    comingSoon.style.display="block";
  }
};

// 🔹 UTIL
function fill(id,list){
  let html="<option value=''>Select</option>";
  list.forEach(i=>html+=`<option>${i}</option>`);
  document.getElementById(id).innerHTML=html;
}

</script>

</body>
</html>
