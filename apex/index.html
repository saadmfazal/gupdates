const cache=new Map();
function currentRoute(){const u=new URL(location.href);return u.searchParams.get('r')||'/';}
function navigate(path,push=true){if(!path)path='/';if(push)history.pushState(null,'','?r='+encodeURIComponent(path));render(path);}
