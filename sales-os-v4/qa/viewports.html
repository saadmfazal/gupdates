<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Morpheus V4 viewport inspection</title><style>*{box-sizing:border-box}body{margin:0;background:#161b20;color:#cbd5db;font:14px system-ui}header{display:flex;align-items:center;gap:15px;padding:10px 18px;height:50px;border-bottom:1px solid #354653}button{padding:7px 11px;border:1px solid #46606e;border-radius:7px;background:#23313a;color:#e0e8ee;cursor:pointer}main{display:flex;justify-content:center;padding:10px;overflow:auto}iframe{border:1px solid #476150;box-shadow:0 20px 70px #0008;background:#040a08;flex:none;width:390px;height:844px}#size{margin-left:auto;color:#8ba4b0;font-size:12px}</style></head><body><header><b>V4 rendered viewport</b><button data-width="390" data-height="844">Phone</button><button data-width="360" data-height="780">Small phone</button><button data-width="844" data-height="390">Landscape</button><button data-width="820" data-height="1000">Tablet</button><span id="size">390 × 844</span></header><main><iframe id="appFrame" title="Sales OS responsive inspection" src="../?v=48#/command"></iframe></main><script>document.querySelectorAll('button[data-width]').forEach(b=>b.onclick=()=>{const frame=document.querySelector('iframe');frame.style.width=b.dataset.width+'px';frame.style.height=b.dataset.height+'px';document.querySelector('#size').textContent=b.dataset.width+' × '+b.dataset.height});</script></body></html>
